apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: epo-iac-tutorial
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/soshwosh/epo-iac-tutorial.git
    targetRevision: main
    path: deploy/chart

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true